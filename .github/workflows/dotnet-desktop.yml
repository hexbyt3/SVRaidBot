name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.read_version.outputs.current_version }}
      version_changed: ${{ steps.compare_versions.outputs.version_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Current Version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/SVRaidBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
      - name: Compare Versions
        id: compare_versions
        run: |
          LAST_VERSION=${{ secrets.LAST_KNOWN_VERSION }}
          CURRENT_VERSION=${{ env.CURRENT_VERSION }}
          echo "Last known version: $LAST_VERSION"
          echo "Current version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" == "$LAST_VERSION" ]; then
            echo "No version change detected."
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version change detected."
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

  # Pull requests always build and test; only a version bump pushed to main publishes.
  build:
    needs: version-check
    if: github.event_name == 'pull_request' || needs.version-check.outputs.version_changed == 'true'
    runs-on: windows-latest
    env:
      Project_Name: SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
      - name: Restore dependencies
        run: dotnet restore ${{ env.Project_Name }} --runtime win-x64
      - name: Build
        run: dotnet build ${{ env.Project_Name }} --configuration Release --no-restore
      - name: Test
        run: dotnet test SysBot.Tests/SysBot.Tests.csproj --configuration Release
      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish ${{ env.Project_Name }} --configuration Release --output ./publish /p:PublishSingleFile=true /p:SelfContained=true /p:EnableCompressionInSingleFile=true /p:RuntimeIdentifier=win-x64
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: SVRaidBot
          path: ./publish
          retention-days: 1

  create-release:
    needs: [version-check, build]
    if: github.event_name == 'push' && needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Current Version
        id: read_version
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/SVRaidBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      - name: Get Recent Changes
        id: recent_changes
        run: |
          LAST_VERSION=${{ secrets.LAST_KNOWN_VERSION }}
          if [ -z "$LAST_VERSION" ] || ! git rev-parse "$LAST_VERSION" >/dev/null 2>&1; then
            echo "LAST_VERSION is not set or not found, using initial commit"
            LAST_VERSION=$(git rev-list --max-parents=0 HEAD)
          fi
          RECENT_CHANGES=$(git log --pretty=format:"- %s" $LAST_VERSION..HEAD)
          echo "RECENT_CHANGES<<EOF" >> $GITHUB_ENV
          echo "$RECENT_CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: SVRaidBot
          path: ./publish
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ env.CURRENT_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.CURRENT_VERSION }}
          body: |
            ## Recent Changes
            ${{ env.RECENT_CHANGES }}
          files: ./publish/SVRaidBot.exe
      - name: Update Last Known Version
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh secret set LAST_KNOWN_VERSION -b"${{ env.CURRENT_VERSION }}"
          echo "LAST_KNOWN_VERSION updated to $CURRENT_VERSION"
